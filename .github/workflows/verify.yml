name: verify

# Corre en cada push y en cada PR. El job se llama "gate" a proposito: ese
# nombre es el que hay que marcar como required check en la proteccion de
# `main`, y es lo que bloquea el merge cuando algo falla.
on:
  push:
    branches: [main, dev]
  pull_request:

# Cancela ejecuciones anteriores del mismo ref cuando hay pushes nuevos.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # La puerta completa. NO compila: `astro build` no debe correr en CI,
      # porque la verificacion es sobre el codigo, no sobre dist/.
      - name: Gate
        run: bun run verify

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/playwright-report/
          retention-days: 7
          if-no-files-found: ignore