# fly.toml — configuración del app `empresaplana-cat`.
#
# Generado por @flydotio/dockerfile y corregido: las dos líneas que traía
# huían de la realidad del contenedor.
#
#   internal_port   → 4321 era el puerto del dev server de Astro. La imagen
#                     escucha en 8080 (ENV PORT=8080 y EXPOSE 8080 del
#                     Dockerfile, y `compute deploy --port 8080`). Con 4321
#                     Fly enrutaba a un puerto cerrado → 502.
#   release_command → 'bunx prisma migrate deploy' abortaba el despliegue:
#                     las migraciones de este repo se escriben y aplican a mano
#                     (sin tabla `_prisma_migrations`), así que contra la base
#                     de producción el primer CREATE TABLE ya existente rompía
#                     la release. Ver docs/architecture/decisions/migration-mapping.md.

app = 'empresaplana'
primary_region = 'fra'

[build]
[deploy]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
